name: Python Quality

on:
  pull_request:
    paths:
      - "server/**"
      - ".pre-commit-config.yaml"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".pre-commit-config.yaml"
      - "Makefile"

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt -r server/requirements-dev.txt

      - name: Ruff
        run: |
          cd server
          ruff check app tests

      - name: Mypy
        run: |
          cd server
          mypy

      - name: Pytest with coverage
        run: |
          cd server
          pytest tests --cov=app --cov-report=term-missing --cov-report=xml
